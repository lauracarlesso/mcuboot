# Opt-in MCUboot XIP (SMIF) encryption for kit_pse84_eval.
#
# This fragment is NOT applied automatically (its name does not match the
# board target). Pass it explicitly when building the MCUboot bootloader:
#
#   west build -b kit_pse84_eval/pse846gps2dbzc4a/m33 \
#       bootloader/mcuboot/boot/zephyr -d build_mcuboot \
#       -- -DEXTRA_CONF_FILE=boards/kit_pse84_eval_pse846gps2dbzc4a_m33_xip_enc.conf
#
# Keep images encrypted in external flash; the SMIF hardware decrypts them
# on the fly during execution. MCUboot validates ciphertext, unwraps the
# per-image AES key (ECIES-P256) and hands it to the application through the
# boot response. The SoC boot_image_jump_hook programs the SMIF crypto engine
# with that key before jumping.
CONFIG_BOOT_ENCRYPT_IMAGE_XIP=y

# Call boot_image_jump_hook() right before jumping. The PSE84 SoC provides a
# strong implementation that programs the SMIF crypto engine with the per-image
# AES key/IV from the boot response so the CPU fetches plaintext.
CONFIG_BOOT_IMAGE_JUMP_HOOKS=y

# A signature is mandatory for encrypted XIP images: the bootloader verifies
# the ciphertext before loading the AES key into the hardware. This overrides
# the board default CONFIG_BOOT_SIGNATURE_TYPE_NONE and also selects
# BOOT_ENCRYPTION_SUPPORT (required by BOOT_ENCRYPT_IMAGE_XIP).
CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y

# Public key compiled into the bootloader to verify image signatures. Replace
# the sample key with your own before shipping.
CONFIG_BOOT_SIGNATURE_KEY_FILE="root-ec-p256.pem"

# ECIES-P256 private key the bootloader uses to unwrap the per-image AES key.
# Applications encrypt with the matching public key (enc-ec256-pub.pem).
# Replace the sample key with your own before shipping.
CONFIG_BOOT_ENCRYPTION_KEY_FILE="enc-ec256-priv.pem"
